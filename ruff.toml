target-version = "py311"
line-length = 100
indent-width = 4

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "DTZ", "T10", "PTH", "ERA", "PL", "TRY", "RUF"
]
ignore = [
    "E501", "B008", "C901", "TRY003", "PTH118",
    "RUF001",     # Cyrillic UI strings are intentional, not "ambiguous"
    "PLW0603",    # module-level engine/factory singleton
    "PLC0415",    # deferred import avoids a circular dependency
    "PLR0913", "PLR0917",  # model/DB helper signatures
    "PLR2004",    # 1024 byte constants in size formatting
]

[lint.per-file-ignores]
"tests/*" = ["S101", "S106", "PLR2004"]

[lint.mccabe]
max-complexity = 15

[lint.isort]
known-first-party = ["bot"]
known-third-party = [
    "aiogram", "sqlalchemy", "pydantic", "pydantic_settings",
    "yt_dlp", "spotdl", "spotipy", "yandex_music",
    "ShazamIO", "lyricsgenius", "ffmpeg",
    "aiohttp", "aiofiles", "tenacity", "structlog"
]
