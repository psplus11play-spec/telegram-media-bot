version: '3.8'

services:
  # Main bot service
  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: telegram-media-bot
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - BOT_ADMIN_IDS=${BOT_ADMIN_IDS:-}
      - BOT_LOCAL_API_URL=${BOT_LOCAL_API_URL:-}
      - BOT_LOCAL_API_FILE_URL=${BOT_LOCAL_API_FILE_URL:-}
      - BOT_WEBHOOK_URL=${BOT_WEBHOOK_URL:-}
      - BOT_WEBHOOK_PATH=${BOT_WEBHOOK_PATH:-/webhook}
      - BOT_WEBHOOK_PORT=${BOT_WEBHOOK_PORT:-8080}
      - DB_URL=${DB_URL:-sqlite+aiosqlite:///data/bot.db}
      - DB_ECHO=${DB_ECHO:-false}
      - DOWNLOAD_TEMP_DIR=${DOWNLOAD_TEMP_DIR:-/app/data/temp}
      - DOWNLOAD_CACHE_DIR=${DOWNLOAD_CACHE_DIR:-/app/data/cache}
      - DOWNLOAD_DOWNLOADS_DIR=${DOWNLOAD_DOWNLOADS_DIR:-/app/data/downloads}
      - DOWNLOAD_MAX_FILE_SIZE=${DOWNLOAD_MAX_FILE_SIZE:-2000000000}
      - DOWNLOAD_MAX_CONCURRENT_DOWNLOADS=${DOWNLOAD_MAX_CONCURRENT_DOWNLOADS:-3}
      - DOWNLOAD_MAX_CONCURRENT_PER_USER=${DOWNLOAD_MAX_CONCURRENT_PER_USER:-2}
      - DOWNLOAD_MAX_CONCURRENT_FFMPEG=${DOWNLOAD_MAX_CONCURRENT_FFMPEG:-2}
      - DOWNLOAD_DEFAULT_VIDEO_QUALITY=${DOWNLOAD_DEFAULT_VIDEO_QUALITY:-720p}
      - DOWNLOAD_DEFAULT_AUDIO_FORMAT=${DOWNLOAD_DEFAULT_AUDIO_FORMAT:-mp3}
      - DOWNLOAD_DEFAULT_AUDIO_BITRATE=${DOWNLOAD_DEFAULT_AUDIO_BITRATE:-320k}
      - DOWNLOAD_YTDLP_COOKIES_FILE=${DOWNLOAD_YTDLP_COOKIES_FILE:-}
      - DOWNLOAD_SPOTDL_CLIENT_ID=${DOWNLOAD_SPOTDL_CLIENT_ID:-}
      - DOWNLOAD_SPOTDL_CLIENT_SECRET=${DOWNLOAD_SPOTDL_CLIENT_SECRET:-}
      - DOWNLOAD_YANDEX_MUSIC_TOKEN=${DOWNLOAD_YANDEX_MUSIC_TOKEN:-}
      - DOWNLOAD_GENIUS_TOKEN=${DOWNLOAD_GENIUS_TOKEN:-}
      - QUEUE_MAX_QUEUE_SIZE=${QUEUE_MAX_QUEUE_SIZE:-100}
      - QUEUE_TASK_TIMEOUT=${QUEUE_TASK_TIMEOUT:-3600}
      - QUEUE_RETRY_ATTEMPTS=${QUEUE_RETRY_ATTEMPTS:-3}
      - QUEUE_RETRY_BASE_DELAY=${QUEUE_RETRY_BASE_DELAY:-2.0}
      - QUEUE_RETRY_MAX_DELAY=${QUEUE_RETRY_MAX_DELAY:-60.0}
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - CACHE_DEFAULT_TTL=${CACHE_DEFAULT_TTL:-3600}
      - CACHE_MAX_SIZE=${CACHE_MAX_SIZE:-1000}
      - RATELIMIT_ENABLED=${RATELIMIT_ENABLED:-true}
      - RATELIMIT_DEFAULT_LIMIT=${RATELIMIT_DEFAULT_LIMIT:-30}
      - RATELIMIT_DOWNLOAD_LIMIT=${RATELIMIT_DOWNLOAD_LIMIT:-10}
      - RATELIMIT_SEARCH_LIMIT=${RATELIMIT_SEARCH_LIMIT:-20}
      - I18N_DEFAULT_LANGUAGE=${I18N_DEFAULT_LANGUAGE:-ru}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-console}
      - LOG_FILE_ENABLED=${LOG_FILE_ENABLED:-true}
      - LOG_STRUCTURED=${LOG_STRUCTURED:-true}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-false}
    volumes:
      - bot_data:/app/data
      - bot_logs:/app/logs
      - ./scripts:/app/scripts:ro
    depends_on:
      - telegram-bot-api
    networks:
      - bot_network

  # Local Telegram Bot API Server
  # Allows uploading files up to 2GB (vs 50MB default)
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    restart: unless-stopped
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - WORKER_COUNT=${WORKER_COUNT:-4}
      - MAX_WORKERS=${MAX_WORKERS:-8}
    volumes:
      - telegram_api_data:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"
    networks:
      - bot_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  bot_data:
  bot_logs:
  telegram_api_data:

networks:
  bot_network:
    driver: bridge