[project]
name = "telegram-media-bot"
version = "0.1.0"
description = "Telegram media downloader and music assistant bot"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Telegram Media Bot Team", email = "team@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    # Bot framework
    "aiogram>=3.13.0,<4.0.0",
    "aiogram-i18n>=1.0.0,<2.0.0",

    # Database
    "sqlalchemy>=2.0.30,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "aiosqlite>=0.19.0,<1.0.0",

    # Configuration
    "pydantic>=2.8.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",

    # Downloading
    "yt-dlp>=2024.1.0,<2025.0.0",
    "spotdl>=4.5.0,<5.0.0",

    # Music APIs
    "spotipy>=2.23.0,<3.0.0",
    "yandex-music-api>=1.0.0,<2.0.0",

    # Recognition & Lyrics
    "ShazamIO>=0.3.0,<1.0.0",
    "lyricsgenius>=3.4.0,<4.0.0",

    # Media processing
    "ffmpeg-python>=0.2.0,<1.0.0",

    # Utilities
    "aiofiles>=23.2.0,<24.0.0",
    "aiohttp>=3.9.0,<4.0.0",
    "tenacity>=8.2.0,<9.0.0",
    "structlog>=24.1.0,<25.0.0",
    "python-json-logger>=2.0.0,<3.0.0",
    "pytz>=2024.1,<2025.0",
    "Babel>=2.15.0,<3.0.0",

    # Validation
    "email-validator>=2.1.0,<3.0.0",
    "pydantic-extra-types>=2.4.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-mock>=3.12.0,<4.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "httpx>=0.27.0,<1.0.0",
    "faker>=25.0.0,<26.0.0",
    "ruff>=0.5.0,<1.0.0",
    "mypy>=1.10.0,<2.0.0",
    "pre-commit>=3.7.0,<4.0.0",
]
docs = [
    "mkdocs>=1.5.0,<2.0.0",
    "mkdocs-material>=9.5.0,<10.0.0",
    "mkdocstrings[python]>=0.25.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/example/telegram-media-bot"
Repository = "https://github.com/example/telegram-media-bot"
Issues = "https://github.com/example/telegram-media-bot/issues"

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PL",  # pylint
    "TRY", # tryceratops
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (handled by line-length)
    "B008",  # function calls in default argument
    "C901",  # too complex (handled separately)
    "TRY003", # avoid specifying exception type
    "PTH118", # os.path vs pathlib
]
per-file-ignores = {
    "tests/*": ["S101", "S106", "PLR2004"],
}
format.quote-style = "double"
format.indent-style = "space"
format.skip-magic-trailing-comma = false

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
known-first-party = ["bot"]
known-third-party = [
    "aiogram",
    "sqlalchemy",
    "pydantic",
    "pydantic_settings",
    "yt_dlp",
    "spotdl",
    "spotipy",
    "yandex_music",
    "ShazamIO",
    "lyricsgenius",
    "ffmpeg",
    "aiohttp",
    "aiofiles",
    "tenacity",
    "structlog",
]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
enable_error_code = [
    "arg-type",
    "attr-defined",
    "call-overload",
    "comparison-overlap",
    "dict-type",
    "has-type",
    "index",
    "list-type",
    "misc",
    "no-untyped-call",
    "no-untyped-def",
    "override",
    "return-value",
    "set-type",
    "str-type",
    "union-attr",
    "var-annotated",
]
[[tool.mypy.overrides]]
module = [
    "tests.*",
    "bot.handlers.*",
]
disallow_untyped_defs = false
check_untyped_defs = false