[project]
name = "telegram-media-bot"
version = "0.2.0"
description = "Telegram media downloader and music assistant bot"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # Bot framework
    "aiogram>=3.13.0,<4.0.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.30,<3.0.0",
    "aiosqlite>=0.19.0,<1.0.0",

    # Configuration
    "pydantic>=2.8.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",

    # Downloading (yt-dlp must stay recent: YouTube changes often)
    "yt-dlp>=2025.1.0",

    # Music
    "shazamio>=0.3.0,<1.0.0",
    "mutagen>=1.47.0,<2.0.0",

    # Networking
    "aiohttp>=3.9.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "ruff>=0.5.0,<1.0.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PL",  # pylint
    "RUF", # ruff-specific
]
ignore = [
    "E501",    # line too long (handled by line-length)
    "B008",    # function calls in default argument
    "C901",    # too complex (handled separately)
    "PLR0912", # many branches (tool dispatch is a switch by design)
    "PLR0913", # model/DB helper signatures
    "PLR0915", # many statements (same)
    "PLR0917", # many positional args (same)
    "PLR2004", # magic values in size/format constants
    "PLW0603", # module-level engine/factory singleton in session.py
    "PLC0415", # deferred imports avoid circular dependencies
    "RUF001",  # Cyrillic UI strings are intentional, not "ambiguous"
    "RUF002",  # same, in docstrings
    "RUF003",  # same, in comments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
known-first-party = ["bot"]
